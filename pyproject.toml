[project]
name = "hybrid-search"
version = "0.1.0"
description = "Hybrid search (BM25 + dense, fused with RRF) and cross-encoder rerank, over a small public-domain medical corpus"
authors = [
    { name = "Numan Ijaz" }
]
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.8",
    "qdrant-client>=1.19",
]

[project.scripts]
hybrid-search = "hybrid_search.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
